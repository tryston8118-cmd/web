<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        button {
            padding: 10px 20px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product {
            border: 1px solid #ddd;
            padding: 15px;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product h3 {
            margin: 10px 0 5px;
        }

        .product p {
            margin: 0;
        }

        body.dark-mode{
                background-color: black;
                color: white
        }

    </style>
</head>

<body>

<button class="dark-mode">Toggle mode</button>

<input type="number" class="priceInput" placeholder="Enter maximum price">

<div class="products"></div>
